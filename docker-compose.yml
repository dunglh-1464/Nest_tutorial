# Infrastructure for local development.
#
# The NestJS app itself is NOT containerised — run it with `npm run start:dev`
# and let it reach these services over localhost.
#
#   docker compose up -d       start everything
#   docker compose ps          check health
#   docker compose down        stop, keep data
#   docker compose down -v     stop and wipe data (full reset)

services:
  postgres:
    image: postgres:17-alpine
    container_name: nest_tutorial_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-nest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nest_password}
      POSTGRES_DB: ${DB_NAME:-nest_tutorial}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` returns 0 only once the server accepts connections, which
      # happens well after the container itself is "running".
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-nest} -d ${DB_NAME:-nest_tutorial}']
      interval: 5s
      timeout: 5s
      retries: 5

  # Separate instance for end-to-end tests (Pull 6). Tests truncate every table
  # between cases, so they must never share a database with development data.
  # No volume: the data is disposable by design.
  postgres_test:
    image: postgres:17-alpine
    container_name: nest_tutorial_postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-nest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nest_password}
      POSTGRES_DB: ${DB_NAME:-nest_tutorial}_test
    ports:
      - '${DB_TEST_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-nest} -d ${DB_NAME:-nest_tutorial}_test']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nest_tutorial_redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
